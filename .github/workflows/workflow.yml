name: build_and_deploy

on:
  push:
    branches: [ "main", "staging" ]

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare vars
        run: |
          echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "IMAGE=mohsin30/${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV
          echo "RELEASE=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        run: docker build -t "$IMAGE:$TAG" . --build-arg GIT_BRANCH="${GITHUB_REF##*/}"

      - name: Push image
        run: docker push "$IMAGE:$TAG"

  deployment:
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save kubeconfig (short-lived)
        run: doctl kubernetes cluster kubeconfig save --expiry-seconds 600 upscalebd

      - name: Setup helmfile
        uses: mamezou-tech/setup-helmfile@v0.8.0
        with:
          additional-helm-plugins: https://github.com/jkroepke/helm-secrets.git --version 2.0.2
          helmfile-version: "v0.138.4"

      - name: Prepare vars
        run: |
          echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "IMAGE=mohsin30/${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV
          echo "RELEASE=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV

      - name: Deploy to Staging
        if: github.ref == 'refs/heads/staging'
        run: |
          export RELEASE="${RELEASE}"
          helmfile -e staging sync \
            --set=image.repository="${IMAGE}" \
            --set=image.tag="${TAG}"

      - name: Deploy to Production
        if: github.ref == 'refs/heads/main'
        run: |
          export RELEASE="${RELEASE}"
          helmfile -e production sync \
            --set=image.repository="${IMAGE}" \
            --set=image.tag="${TAG}"
